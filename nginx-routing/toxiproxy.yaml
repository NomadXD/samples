apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
    spec:
      containers:
      - name: toxiproxy
        image: shopify/toxiproxy
        ports:
        - name: redis
          containerPort: 26379
        - name: toxiproxy
          containerPort: 8474
        args: ["-host", "0.0.0.0"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: toxiproxy-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: toxiproxy-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy-service
spec:
  selector:
    app: toxiproxy
  ports:
    - protocol: TCP
      port: 26379
      targetPort: 26379
      name: redis
    - protocol: TCP
      port: 8474
      targetPort: 8474
      name: toxiproxy
  type: ClusterIP
