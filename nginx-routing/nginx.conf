events {
    worker_connections 1024;  # Adjust the number of connections as needed
}

http {
    server {
        listen 80;
        server_name localhost;  # Your domain or server name
        access_log /dev/stdout;
        error_log /dev/stderr info;

        location /_t/ {
            resolver local=on;
            # rewrite ^/_t(/.*)$ $1 break;
            access_by_lua_block {
                ngx.log(ngx.INFO, "URI ", ngx.var.uri)
                ngx.log(ngx.INFO, "Request URI ", ngx.var.request_uri)
            }
            proxy_pass http://backend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            resolver local=on;
            proxy_pass http://backend_prod;  # URL of your backend server
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # location ~ ^/_t(/.*)?$ {
