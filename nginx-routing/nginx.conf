        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        # location ~ ^/_t/ {
        #     resolver local=on;
        #     rewrite ^/_t(/.*)$ $1 break;
        #     proxy_pass http://backend_dev;  # URL of your development backend server
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        # location /_t/ {
        #     resolver local=on;
        #     rewrite ^/_t(/.*)$ $1;
        #     proxy_pass http://backend_dev;  # URL of your backend server
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
