version: "3"
services:
  nginx:
    image: openresty/openresty:latest
    volumes:
      - ./nginx-redis-keepalive.conf:/usr/local/openresty/nginx/conf/nginx.conf
    ports:
      - "8080:8080"
    # environment:
    #   - REDIS_HOST=redis
    #   - REDIS_PORT=6379
    #   - REDIS_SSL=false
    #   - REDIS_SSL_VERIFY=false
    networks:
      - nginx-network
    command:
      [
        "/usr/local/openresty/bin/openresty",
        "-c",
        "/usr/local/openresty/nginx/conf/nginx.conf",
        "-g",
        "daemon\ off;",
      ]

  backend_dev:
    image: solsson/http-echo:latest
    networks:
      - nginx-network
    environment:
      - PORT=8080
      - TEXT="Hello from backend service"

  backend_prod:
    image: solsson/http-echo:latest
    networks:
      - nginx-network
    environment:
      - PORT=8080
      - TEXT="Hello from backend service"

  redis:
    container_name: redis
    image: redis
    ports:
      - "6379:6379"
    networks:
      - nginx-network

  redisdebug:
    container_name: redisdebug
    image: redis
    ports:
      - "6381:6379"
    networks:
      - nginx-network

  # speedbump:
  #   image: kffl/speedbump:latest
  #   networks:
  #     - nginx-network
  #   command: ["--latency=3000ms", "--port=26379", "redis:6379"]
  #   ports:
  #     - "26379:26379"
  toxiproxy:
    image: shopify/toxiproxy
    restart: always
    ports:
      - "8474:8474" # Toxiproxy API port
      # - "26379:26379" # Redis port
    networks:
      - nginx-network
    command: ["-host", "0.0.0.0"]
  # volumes:
  #   - ./toxiproxy.sh:/docker-entrypoint-initdb.d/toxiproxy.sh
  # entrypoint: ["/bin/sh", "/docker-entrypoint-initdb.d/toxiproxy.sh"]

networks:
  nginx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.144.0/20
          gateway: 192.168.144.1
