events {
    worker_connections 1024;  # Adjust the number of connections as needed
}

http {
    server {
        listen 80;
        server_name localhost;  # Your domain or server name
        access_log /dev/stdout;
        error_log /dev/stderr info;

        location / {
            resolver local=on;
            set_by_lua_block $REDIS_HOST { return "redis" }
            set_by_lua_block $REDIS_PORT { return 6379 }
            set_by_lua_block $REDIS_SSL { return false }
            set_by_lua_block $REDIS_SSL_VERIFY { return false }
            set_by_lua_block $REDIS_PASSWORD { return os.getenv("REDIS_PASSWORD") }
            set_by_lua_block $REDIS_PASSWORD { return os.getenv("REDIS_DATABASE") }
            access_by_lua_block{
                ngx.log(ngx.INFO, "REDIS_HOST: ", ngx.var.REDIS_HOST)
                local function getRedisValue(key, redis_host, redis_port, redis_ssl, redis_ssl_verify, redis_password, redis_database, correlation_id)
                    local redis = require "resty.redis"

                    local red = redis:new()
                    red:set_timeout(1000) -- 1 second
                    ngx.log(ngx.INFO, "correlation-id: ", correlation_id, "connecting to Redis database..")
                    local ok, err = red:connect(redis_host, 6379)
                    if not ok then
                        ngx.log(ngx.ERR, "correlation-id: ", correlation_id, "failed to connect to redis: ", err)
                        return nil, err
                    end

                    -- local res, err = red:auth(redis_password)
                    -- if not res then
                    --    ngx.log(ngx.ERR, "correlation-id: ", correlation_id, "failed to authenticate redis server: ", err)
                    --    return nil, err
                    -- end

                    red:select(2)
                    local redisResponse, err = red:get(key)

                    if not redisResponse then 
                        ngx.log(ngx.ERR, "correlation-id: ", correlation_id, "failed to retrieve step limit cache value from redis ", err)
                        return nil, err
                    end

                    ngx.log(ngx.INFO, "redisResponse", redisResponse)
                    
                    local ok, err = red:set_keepalive(100000, 100)
                    if not ok then
                        ngx.log(ngx.ERR, "correlation-id: ", correlation_id, "failed to set keepalive: ", err)
                        return redisResponse, err
                    end

                    return redisResponse, nil
                end
                local uri = ngx.var.uri
                local host = ngx.var.host
                local requestUri = ngx.var.request_uri

                -- Log the variables
                ngx.log(ngx.INFO, "URI: ", uri)
                ngx.log(ngx.INFO, "Host: ", host)
                ngx.log(ngx.INFO, "Request URI: ", requestUri)

                if uri == nil or uri == "/" or uri == "" then
                    return ngx.exit(404)
                end

                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(1000)

                ngx.say("reused times log line 1: ", red:get_reused_times())
                local ok, err = red:connect("redis", 6379)
                if not ok then
                    ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                    ngx.exit(500)
                end

                ngx.say("reused times log line 2: ", red:get_reused_times())
                local ok, err = red:set_keepalive(100000, 100)
                if not ok then
                    ngx.log(ngx.ERR, "correlation-id: ", correlation_id, "failed to set keepalive: ", err)
                    return redisResponse, err
                end

                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(1000)

                local ok, err = red:connect("redis", 6379)
                if not ok then
                    ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                    ngx.exit(500)
                end
                ngx.say("reused times log line 3: ", red:get_reused_times())


                local ok, err = red:set_keepalive(100000, 100)
                if not ok then
                    ngx.log(ngx.ERR, "correlation-id: ", correlation_id, "failed to set keepalive: ", err)
                    return redisResponse, err
                end

            }
            proxy_pass http://backend_server;  # URL of your backend server
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    upstream backend_server {
        server backend_dev:8080;  # IP and port of your backend server
    }
}
