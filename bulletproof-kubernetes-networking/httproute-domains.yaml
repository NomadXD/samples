# Route for abc.com
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: abc-route
spec:
  parentRefs:
  - name: external-gateway
    namespace: envoy-gateway-system
  hostnames:
  - abc.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: echo-app
      port: 80
---
