---
# Namespace for tenant-marketing
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-marketing
  labels:
    name: tenant-marketing
---
# Deployment for marketing-app-1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-app-1
  namespace: tenant-marketing
  labels:
    app: marketing-app-1
    tenant: marketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketing-app-1
  template:
    metadata:
      labels:
        app: marketing-app-1
        tenant: marketing
    spec:
      containers:
      - name: echo-server
        image: ealen/echo-server:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        - name: LOGS__IGNORE__PING
          value: "true"
        - name: ENABLE__ENVIRONMENT
          value: "true"
        - name: ENABLE__HEADER
          value: "true"
        - name: ENABLE__REQUEST
          value: "true"
        - name: ENABLE__COOKIES
          value: "true"
        - name: ENABLE__FILE
          value: "false"
        - name: ECHO__CODE
          value: "200"
        - name: ECHO__BODY
          value: "Hello from Marketing App 1!"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Service for marketing-app-1
apiVersion: v1
kind: Service
metadata:
  name: marketing-app-1
  namespace: tenant-marketing
  labels:
    app: marketing-app-1
    tenant: marketing
spec:
  type: ClusterIP
  selector:
    app: marketing-app-1
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP