---
# First install cert-manager if not already installed:
# kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml

# ClusterIssuer for Let's Encrypt (production)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com  # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
---
# Certificate resource that cert-manager will use to generate the certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-gateway-cert
  namespace: gateway-system
spec:
  secretName: external-gateway-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - your-domain.com        # Replace with your actual domain
  - www.your-domain.com    # Add additional domains as needed