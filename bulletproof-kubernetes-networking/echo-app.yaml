---
# Deployment for echo app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-app
  labels:
    app: echo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-app
  template:
    metadata:
      labels:
        app: echo-app
    spec:
      containers:
      - name: echo-server
        image: ealen/echo-server:latest
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        - name: LOGS__IGNORE__PING
          value: "true"
        - name: ENABLE__ENVIRONMENT
          value: "true"
        - name: ENABLE__HEADER
          value: "true"
        - name: ENABLE__REQUEST
          value: "true"
        - name: ENABLE__COOKIES
          value: "true"
        - name: ENABLE__FILE
          value: "false"
        - name: ECHO__CODE
          value: "200"
        - name: ECHO__BODY
          value: "Hello from Echo App!"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Service for echo-app
apiVersion: v1
kind: Service
metadata:
  name: echo-app
  labels:
    app: echo-app
spec:
  type: ClusterIP
  selector:
    app: echo-app
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP