# Three worker nodes, each in its own simulated zone. Node labels are picked
# up by the EndpointSlice controller, so backends pinned to a zone via
# nodeSelector inherit that zone in their slice automatically.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: envoy-zone-aware
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/region: us-east-1
      topology.kubernetes.io/zone: us-east-1a
  - role: worker
    labels:
      topology.kubernetes.io/region: us-east-1
      topology.kubernetes.io/zone: us-east-1b
  - role: worker
    labels:
      topology.kubernetes.io/region: us-east-1
      topology.kubernetes.io/zone: us-east-1c
