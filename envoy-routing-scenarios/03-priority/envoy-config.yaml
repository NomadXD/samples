apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-bootstrap
data:
  envoy.yaml: |
    # No node.locality and no common_lb_config.zone_aware_lb_config:
    # this scenario relies purely on Envoy's priority-based routing,
    # which is independent of locality matching.
    node:
      id: envoy-priority
      cluster: envoy-priority

    static_resources:
      listeners:
        - name: http
          address:
            socket_address: { address: 0.0.0.0, port_value: 10000 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    route_config:
                      virtual_hosts:
                        - name: vh
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: backend }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: backend
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: backend
            # Envoy treats P=0 as the only group receiving traffic while
            # its health ratio (after overprovisioning_factor, default 1.4)
            # is at or above 1.0. P=1 only takes over when P=0 cannot serve
            # the full load. Scale backend-primary to zero replicas to see
            # the failover behavior.
            endpoints:
              - priority: 0
                lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: backend-primary.default.svc.cluster.local
                          port_value: 5678
              - priority: 1
                lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: backend-fallback.default.svc.cluster.local
                          port_value: 5678

    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
